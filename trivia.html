<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="dados.html">Dados</a>
        <a href="trivia.html">Trivia</a>
        <a href="blackjack.html">Blackjack</a>
        <a href="puntajes.html">Puntajes</a>
        <a href="presentacion.html">Integrantes</a>
    </nav>

    <main class="layout-juego">
        <!-- ZONA DE JUEGO (IZQUIERDA) -->
        <div class="area-juego">
            <h1>Juego de Trivia</h1>

            <section id="zona-config" style="background: transparent; border: none; box-shadow: none; padding: 0; margin-bottom: 0;">
                <h2>Configuración</h2>
                <div class="form-control">
                    
                    <div class="campo-form">
                        <label for="nombre-jugador">Nombre:</label>
                        <input type="text" id="nombre-jugador" placeholder="Ej: Celeste">
                    </div>

                    <div class="campo-form">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria"></select>
                    </div>

                    <div class="campo-form">
                        <label for="dificultad">Dificultad:</label>
                        <select id="dificultad">
                            <option value="easy">Fácil</option>
                            <option value="medium">Media</option>
                            <option value="hard">Difícil</option>
                        </select>
                    </div>

                    <button id="btn-comenzar">Comenzar Juego</button>
                </div>
            </section>

            <section id="zona-juego" class="oculto" style="background: transparent; border: none; box-shadow: none; padding: 0; margin-bottom: 0;">
                <div id="tiempo-restante">Tiempo restante: 10</div>
                <h3 id="pregunta"></h3>
                <div id="opciones" class="opciones-container"></div>
                <div id="resultado" class="oculto"></div>
            </section>
        </div>

        <!-- REGLAS (DERECHA) -->
        <aside class="sidebar-reglas">
            <h3>Reglas de la Trivia</h3>
            <br>
            <p>- Ingresá tu nombre, categoría y dificultad.</p>
            <p>- Tenés 10 segundos para responder cada pregunta.</p>
            <p>- Cada acierto suma 10 puntos a tu récord.</p>
            <p>- ¡Superá tu mejor puntuación!</p>
        </aside>
    </main>
<img src="img/telefono.png" alt="teléfono" class="imagen-telefono">
<img src="img/cd.png" alt="cd" class="imagen-cd">
<img src="img/circulos.png" alt="circulos" class="imagen-circulos">
    <script src="js/trivia.js"></script>
</body>
</html>
