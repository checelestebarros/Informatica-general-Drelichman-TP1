<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generala</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="dados.html">Dados</a>
        <a href="trivia.html">Trivia</a>
        <a href="blackjack.html">Blackjack</a>
        <a href="puntajes.html">Puntajes</a>
        <a href="presentacion.html">Integrantes</a>
    </nav>

    <main class="contenedor-principal">
        <h1>Juego de Dados</h1>

        <section class="tarjeta-seccion">
            <div class="contenedor-nombres">
                <div>
                    <label>Nombre J1:</label>
                    
                    <input type="text" id="nombre-j1" placeholder="Ej: Celeste" required>
                </div>
                <div>
                    <label>Nombre J2:</label>
                    <input type="text" id="nombre-j1" placeholder="Ej: Santos" required>
                </div>
            </div>

            <div class="marcador">
                <div>
                    <h3 id="label-j1">Jugador 1</h3>
                    <p id="puntos-j1">Puntos: 0</p>
                </div>
                <div>
                    <h3 id="label-j2">Jugador 2</h3>
                    <p id="puntos-j2">Puntos: 0</p>
                </div>
            </div>

            <p id="info-turno">Turno actual: Jugador 1</p>
            <p id="info-tiradas">Tiradas: 0 / 3</p>

            <div id="zona-dados" class="zona-dados"></div>

            <button id="btn-tirar">Tirar Dados</button>
            <button id="btn-nueva-partida">Nueva Partida</button>
        </section>
    </main>

    <script src="js/dados.js"></script>
</body>
</html>
