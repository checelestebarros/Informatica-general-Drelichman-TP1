<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Dados</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/dados.js" defer></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="dados.html" class="active">Dados</a>
      <a href="trivia.html">Trivia</a>
      <a href="blackjack.html">Blackjack</a>
      <a href="puntajes.html">Puntajes</a>
      <a href="presentacion.html">Integrantes</a>
    </nav>
  </header>

  <main class="contenedor-principal">
    <h1>Juego de Dados</h1>
    
    <section class="tarjeta-seccion">
      <div class="form-control">
        <div class="campo-form">
          <label for="input-j1">Nombre J1:</label>
          <input type="text" id="input-j1" placeholder="Ej: Celeste">
        </div>

        <div class="campo-form">
          <label for="input-j2">Nombre J2:</label>
          <input type="text" id="input-j2" placeholder="Ej: Santos">
        </div>
      </div>

      <div style="margin: 20px 0;">
        <p><strong id="nombre-display-j1">Jugador 1</strong></p>
        <p>Puntos: <span id="puntos-j1">0</span></p>
        <br>
        <p><strong id="nombre-display-j2">Jugador 2</strong></p>
        <p>Puntos: <span id="puntos-j2">0</span></p>
      </div>

      <div>
        <p id="indicador-turno">Turno actual: <strong>Jugador 1</strong></p>
        <p id="tiradas">Tiradas: 0 / 3</p>
      </div>

      <!-- Acá van a aparecer tus 5 dados dinámicamente -->
      <div id="dados" style="margin: 20px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;"></div>
      
      <!-- Mensajes de fin de turno/partida -->
      <p id="mensaje" style="color: #00ff66; margin-bottom: 15px; font-size: 0.75rem;"></p>

      <div>
        <button id="btnTirar" class="btn">Tirar Dados</button>
        <button id="btnReiniciar" class="btn">Nueva Partida</button>
      </div>
    </section>
  </main>
</body>
</html>
