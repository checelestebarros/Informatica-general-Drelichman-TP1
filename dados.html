<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Dados</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="dados.html" class="active">Dados</a>
      <a href="trivia.html">Trivia</a>
      <a href="blackjack.html">Blackjack</a>
      <a href="puntajes.html">Puntajes</a>
      <a href="presentacion.html">Integrantes</a>
    </nav>
  </header>

  <main class="game-container">
    <h1>Juego de Dados</h1>
    
    <div class="card">
      <div class="input-group">
        <label for="j1">Nombre J1:</label>
        <input type="text" id="j1" placeholder="Ej: Celeste">
      </div>

      <div class="input-group">
        <label for="j2">Nombre J2:</label>
        <input type="text" id="j2" placeholder="Ej: Santos">
      </div>

      <div class="scores">
        <p><strong id="p1-name">Jugador 1</strong></p>
        <p>Puntos: <span id="p1-score">0</span></p>
        
        <p><strong id="p2-name">Jugador 2</strong></p>
        <p>Puntos: <span id="p2-score">0</span></p>
      </div>

      <div class="game-status">
        <p>Turno actual: <span id="current-player">Jugador 1</span></p>
        <p>Tiradas: <span id="roll-count">0</span> / 3</p>
      </div>

      <div id="dice-container" class="dice-display"></div>

      <div class="actions">
        <button id="btn-tirar">Tirar Dados</button>
        <button id="btn-nueva">Nueva Partida</button>
      </div>
    </div>
  </main>
  <script src="js/dados.js" defer></script>
</body>
</html>
